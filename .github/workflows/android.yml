name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project_path: Lab7/lab4
            app_path: app
            needs_firebase: true
          - project_path: Lab8
            app_path: lab5/app
            needs_firebase: false

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        if: ${{ matrix.needs_firebase }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > ${{ matrix.project_path }}/${{ matrix.app_path }}/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ${{ matrix.project_path }}

      - name: Build the app
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ matrix.project_path }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: ${{ matrix.project_path }}

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ strategy.job-index }}
          path: ${{ matrix.project_path }}/${{ matrix.app_path }}/build/reports/tests/testDebugUnitTest

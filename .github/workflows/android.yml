name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # with:
        #   wrapper-validation-enabled: false

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > Lab7/lab4/app/google-services.json

      - name: Make gradlew executable
        run: chmod +x Lab7/lab4/gradlew

      - name: Build the app
        run: ./gradlew assembleDebug --stacktrace
        working-directory: Lab7/lab4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: Lab7/lab4

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: Lab7/lab4/app/build/reports/tests/testDebugUnitTest
